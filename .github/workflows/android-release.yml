name: Android APK Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "Using runner pre-installed Android SDK at $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Run Domain & Data Unit Tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION_TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/ego-music-player-${VERSION_TAG}-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/ego-music-player-latest-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ego-music-player-apk
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: "Ego Music Player ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
